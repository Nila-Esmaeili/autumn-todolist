<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Autumn To Do List</title>
</head>
<body>
  <div id="myDIV" class="header">
    <h2>My To Do List</h2>
    <input type="text" id="myInput"
    placeholder="My new task...">
    <span onclick="newElement()"
    class="addBtn">Add</span>
  </div>

  <ul id="myUL">
    <li>Study English</li>
    <li>Buy Eggs</li>
    <li class="checked">Watch Youtube</li>
    <li>Read a book</li>
    <li>Meet friends</li>
    <li>Do Laundry</li>
    <li>Do the dishes</li>
  </ul>

  <script src="main.js"></script>
</body>
</html>
